# Coverage Ratchet (ENG-P1-1)
#
# The two CI pipelines enforce "never go below the baseline" via
# server/.coverage-baseline and client/.coverage-baseline. This workflow
# closes the loop in the other direction: after every main push it
# re-measures, and when main scores HIGHER than the checked-in baseline it
# opens a bump PR. Baselines therefore only ever move up, one bot PR at a
# time — no manual bookkeeping, no big-bang coverage drive.
#
# Design notes:
# - PRs can never lower coverage (fail-under = baseline), so the ratchet PR
#   itself always passes the gate.
# - The bump PR touches exactly one file, so review is trivial.
# - peter-evans/create-pull-request updates the same branch if a ratchet PR
#   is already open instead of spamming duplicates.

name: Coverage Ratchet

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/coverage-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coverage-ratchet-main
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Server baseline bump
  # ============================================================================
  server-ratchet:
    name: Server ratchet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        # pgvector image required by migration 0001 (CREATE EXTENSION vector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: Finvo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --group test

      - name: Measure coverage (no gate)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/Finvo_test # pragma: allowlist secret
          POSTGRES_DB: Finvo_test
          JWT_SECRET_KEY: test-secret-key-for-ci # pragma: allowlist secret
          ENCRYPTION_KEY: v3u8eA7-R5i_oX6DozID8lH_l6ApxfGqI8Xh-8o9mG4= # pragma: allowlist secret
          OPENAI_API_KEY: sk-test-key-for-ci # pragma: allowlist secret
          ENVIRONMENT: test
        run: |
          uv run pytest tests/ --cov=app --cov-report=xml --cov-fail-under=0 -q -p no:warnings
          MEASURED=$(python -c "import xml.etree.ElementTree as ET; print(int(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100))")
          BASELINE=$(grep -v '^#' .coverage-baseline | tr -d '[:space:]')
          echo "Measured: ${MEASURED}% / baseline: ${BASELINE}%"
          if [ "$MEASURED" -gt "$BASELINE" ]; then
            printf '%s\n' "$MEASURED" > .coverage-baseline
            # Keep the history comment truthful without hand-editing.
            echo "Bumped server baseline ${BASELINE} -> ${MEASURED}"
          else
            echo "No bump (measured <= baseline)."
          fi

      - name: Open bump PR if baseline moved
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/coverage-ratchet-server
          commit-message: "chore(server): ratchet coverage baseline"
          title: "chore(server): ratchet coverage baseline"
          body: "Automated ratchet: main measured above the checked-in baseline. Review = confirm the diff touches only `server/.coverage-baseline`."
          add-paths: server/.coverage-baseline

  # ============================================================================
  # Client baseline bump
  # ============================================================================
  client-ratchet:
    name: Client ratchet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Measure coverage (no gate)
        # Test failures must not block the measurement: lcov.info is still
        # written, and the baseline tracks coverage only (red tests are a
        # separate CI signal handled by client-ci).
        run: |
          flutter test --coverage || true
          MEASURED=$(awk -F: '/^LF:/{lf+=$2}/^LH:/{lh+=$2}END{printf "%d", lh*100/lf}' coverage/lcov.info)
          BASELINE=$(grep -v '^#' .coverage-baseline | tr -d '[:space:]')
          echo "Measured: ${MEASURED}% / baseline: ${BASELINE}%"
          if [ "$MEASURED" -gt "$BASELINE" ]; then
            printf '%s\n' "$MEASURED" > .coverage-baseline
            echo "Bumped client baseline ${BASELINE} -> ${MEASURED}"
          else
            echo "No bump (measured <= baseline)."
          fi

      - name: Open bump PR if baseline moved
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/coverage-ratchet-client
          commit-message: "chore(client): ratchet coverage baseline"
          title: "chore(client): ratchet coverage baseline"
          body: "Automated ratchet: main measured above the checked-in baseline. Review = confirm the diff touches only `client/.coverage-baseline`."
          add-paths: client/.coverage-baseline
