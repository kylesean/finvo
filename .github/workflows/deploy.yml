# Build and Push Docker Image to GitHub Container Registry (GHCR)
# Triggers on push to main branch, semantic version tags (e.g., v1.0.0, v0.2.1-alpha), and manual dispatch.

name: Deploy Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kylesean/finvo-api

jobs:
  build-and-push:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Backend CI to pass on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # ENG-P1-3 gate: never ship an image for a commit whose Backend CI
          # (lint/mypy/tests/migrations) failed or never ran. Branch pushes
          # wait until the run for this exact commit completes; tag pushes of
          # commits outside the CI path filters are allowed after a grace
          # period, with an explicit warning.
          deadline=$(( $(date +%s) + 2400 ))   # 40 min: CI runs ~5-10 min normally
          grace_deadline=$(( $(date +%s) + 600 ))  # 10 min for a run to even appear
          is_tag=false
          case "${GITHUB_REF}" in refs/tags/*) is_tag=true ;; esac
          while true; do
            read -r s_count b_count < <(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backend-ci.yml/runs?head_sha=${SHA}&per_page=20" \
                --jq '{s: ([.workflow_runs[] | select(.conclusion == "success")] | length),
                       b: ([.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length)}
                      | "\(.s) \(.b)"' \
                2>/dev/null || echo "0 0"
            )
            if [ "${s_count:-0}" -gt 0 ]; then
              echo "Backend CI passed for ${SHA} — proceeding with the image build."
              exit 0
            fi
            if [ "${b_count:-0}" -gt 0 ]; then
              echo "::error::Backend CI did not pass for ${SHA} — refusing to build/push an image."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for Backend CI on ${SHA}."
              exit 1
            fi
            if [ "${is_tag}" = "true" ] && [ "$(date +%s)" -ge "$grace_deadline" ]; then
              echo "::warning::No Backend CI run found for ${SHA} after 10 minutes (tag of a commit outside CI path filters?) — proceeding WITHOUT a CI gate."
              exit 0
            fi
            echo "Backend CI for ${SHA} is queued/running… waiting 30s."
            sleep 30
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
