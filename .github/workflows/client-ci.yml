# Client CI/CD Pipeline
# Triggers on push/PR to main/develop branches for client/ directory changes

name: Client CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  # ============================================================================
  # Flutter Analysis & Tests
  # ============================================================================
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Generated code (.g.dart / .freezed.dart / slang) is committed to the
      # repo. Regenerating it in CI and failing on any diff catches drift
      # (a source edit that forgot to run build_runner), which analyze/test
      # alone cannot detect because the stale generated files still compile.
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
          if [ -n "$(git status --porcelain lib/)" ]; then
            echo "Generated files are out of date. Run: dart run build_runner build --delete-conflicting-outputs && dart run slang"
            git diff --stat lib/
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      # Coverage gate: fail the build if line coverage drops below the
      # threshold. Measured baseline is ~15.2%; the threshold is set to 13%
      # to avoid flaky reds from small fluctuations. Raise it (5% at a time)
      # as page/widget tests are added. The comparison is done in pure awk so
      # the gate works on any runner (no `bc` dependency).
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(awk -F: '/^LF:/{lf+=$2}/^LH:/{lh+=$2}END{printf "%.1f", lh*100/lf}' coverage/lcov.info)
          echo "Line coverage: ${COVERAGE}% (threshold: 13%)"
          awk -v c="$COVERAGE" 'BEGIN { if (c < 13) { print "::error::Line coverage " c "% is below the 13% threshold"; exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: client/coverage/
          retention-days: 7
        if: success()

  # ============================================================================
  # Build Android APK (for PR validation)
  # ============================================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ============================================================================
  # Build iOS (for PR validation)
  # ============================================================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign
