# iOS IPA Build (Sideload Version)
# Builds an unsigned IPA for sideloading via AltStore, Sideloadly, etc.
# Only triggered manually or on version tags to save macOS runner costs (10x Linux).

name: Build iOS IPA (Sideload)

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA for sideloading
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../Finvo_Sideload.ipa Payload
          echo "IPA created at: $(pwd)/../../Finvo_Sideload.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finvo-iOS-IPA
          path: client/build/Finvo_Sideload.ipa
          retention-days: 30
