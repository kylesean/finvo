name: Finvo
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: Finvo-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432" # Use 5433 externally to avoid conflict with local Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - monitoring
    labels:
      - "project=Finvo"
      - "component=database"

  redis:
    image: redis:alpine
    container_name: Finvo-redis
    ports:
      - "6380:6379" # Use 6380 externally to avoid conflict with local Redis
    volumes:
      - redis-data:/data
    networks:
      - monitoring
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "project=Finvo"
      - "component=redis"

  # Single API service with dynamic environment
  app:
    image: finvo-api:${APP_ENV:-development}
    build:
      context: ./server
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: Finvo-api
    ports:
      - "8000:8000"
    # WARNING: keep UVICORN_WORKERS=1. The in-process scheduler (recurring
    # transactions), rate limiter and metrics all assume a single process;
    # multiple workers would run scheduled jobs concurrently (duplicate
    # transactions) and distort rate limits/metrics.
    command: >
      sh -c "if [ \"$${APP_ENV}\" = \"development\" ]; then
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app;
             else
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers \"$${UVICORN_WORKERS:-1}\";
             fi"
    volumes:
      - ./server/app:/app/app
      - ./server/logs:/app/logs
      - ./server/storage:/app/storage
      - ./server/artifacts:/app/artifacts
    env_file:
      - ./server/.env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    labels:
      - "project=Finvo"
      - "component=api"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - monitoring

  # =============================================================================
  # Optional Monitoring Stack (Enterprise-grade observability)
  # Enable with: docker compose --profile monitoring up -d
  # =============================================================================

  # Prometheus - Time-series database for metrics collection
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.13.1
    container_name: Finvo-prometheus
    ports:
      - "9099:9090"
    volumes:
      - ./server/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - monitoring
    restart: always
    labels:
      - "project=Finvo"
      - "component=monitoring"

  # Grafana - Visualization and dashboards
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.1.1
    container_name: Finvo-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./server/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./server/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    restart: always
    labels:
      - "project=Finvo"
      - "component=monitoring-ui"

  # cAdvisor - Container resource monitoring
  cadvisor:
    profiles: [monitoring]
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: Finvo-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: always
    labels:
      - "project=Finvo"
      - "component=monitoring-agent"

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-storage:
  postgres-data:
  redis-data:
