# Global Pre-commit hooks for Finvo (Mono-repo)
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files

default_language_version:
  python: python3.13

repos:
  # ============================================================================
  # Python Hooks (Backend)
  # ============================================================================
  # Run ruff via uv inside server/ so hooks always use the locked version from
  # server/uv.lock. A pinned ruff-pre-commit rev drifts from the project version
  # and produces conflicting isort verdicts between commit time and `make lint`.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c "cd server && uv run ruff check --force-exclude --fix"
        language: system
        pass_filenames: false
        files: ^server/
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: bash -c "cd server && uv run ruff format --force-exclude"
        language: system
        pass_filenames: false
        files: ^server/
        types: [python]

  # Use local mypy via uv to ensure project venv and pyproject.toml config are used
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c "cd server && uv run mypy --package app"
        language: system
        pass_filenames: false
        files: ^server/
        types: [python]

      - id: bandit
        name: bandit
        entry: bash -c "cd server && uv run bandit -c pyproject.toml -r app/ -ll"
        language: system
        pass_filenames: false
        files: ^server/
        types: [python]

  # ============================================================================
  # Dart/Flutter Hooks (Frontend) - Using Local Commands
  # ============================================================================
  - repo: local
    hooks:
      - id: dart-format
        name: Dart Format
        entry: dart format
        language: system
        types: [dart]
        files: ^client/
      - id: flutter-analyze
        name: Flutter Analyze
        entry: bash -c "cd client && flutter analyze"
        language: system
        types: [dart]
        files: ^client/
        pass_filenames: false

  # ============================================================================
  # General File Checks
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^(server/\.env|server/\.env\.example|client/\.env|client/\.env\.example)$
      - id: trailing-whitespace
        exclude: ^(server/\.env|server/\.env\.example|client/\.env|client/\.env\.example)$
      # ------------------------------------------------------------------------
      # 待发布 v0.1 后启用：禁止直接提交到主分支，强制执行特性分支开发流程
      # ------------------------------------------------------------------------
      # - id: no-commit-to-branch
      #   args: [--branch, main, --branch, master]
      - id: detect-private-key
      - id: check-ast
      - id: debug-statements

  # ============================================================================
  # Security (Secrets)
  # ============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            server/uv\.lock|
            client/pubspec\.lock|
            .*\.g\.dart|            # Ignore Flutter generated code
            .*\.freezed\.dart|      # Ignore code gen
            server/tests/.*|        # Ignore python tests
            client/test/.*|         # Ignore flutter tests
            .*\.json|
            .*\.xcscheme|
            client/\.metadata
          )$

  # ============================================================================
  # Meta Checks
  # ============================================================================
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject
        files: ^server/pyproject.toml
