[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[project]
name = "Finvo-api"
version = "0.2.2-alpha"
description = "Finvo: Self-Hosted & Privacy-First AI Financial Assistant"
requires-python = ">=3.13"
dependencies = [
    # Web framework & ASGI server
    "fastapi>=0.121.0",
    "uvicorn>=0.34.0",
    "uvloop>=0.22.1",
    "python-multipart>=0.0.31",
    # Config & validation
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.2.2",
    # Database: asyncpg for async ORM, psycopg v3 for LangGraph checkpointer & sync scripts
    "sqlmodel>=0.0.24",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    # Auth & security
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.3.0",
    "cryptography>=48.0.1",
    # LLM / agent framework
    "langchain>=0.3.0",
    "langchain-core>=1.2.5",
    "langchain-openai>=1.0.2",
    "langchain-community>=0.4.1",
    "langgraph>=1.1.0,<2.0.0",
    "langgraph-checkpoint-postgres>=3.0.1,<4.0.0",
    "langfuse==3.9.1",
    "mem0ai>=1.0.0",
    "tenacity>=9.1.2",
    "ddgs>=9.6.0",
    # Cache, scheduling & logging
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "structlog>=25.2.0",
    # Rate limiting & metrics
    "slowapi>=0.1.9",
    "prometheus-client>=0.19.0",
    # File storage & processing
    "aiobotocore>=2.13.0",
    "webdav4>=0.9.8",
    "aiofiles>=23.2.1",
    "pillow>=12.3.0",
    # Misc utilities
    "fastapi-pagination>=0.15.1",
    "uuid-utils>=0.12.0",
    "python-dateutil>=2.8.2",
    "jieba>=0.42.1",
    "firebase-admin>=7.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    # mypy 2.x works, but requires local_partial_types = false below (pydantic plugin compat)
    "mypy>=1.20.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "radon>=6.0.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.0",
    "types-aiofiles>=23.2.0",
    "types-pyyaml>=6.0.12.20250915",
    # Dev-only helper scripts (scripts/show_qr.py, evals/)
    "qrcode>=8.2",
    "tqdm>=4.67.1",
    "colorama>=0.4.6",
]
test = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.92.0",
    "aiosqlite>=0.22.0",
    "testcontainers[postgres]>=4.0",
]

[tool.uv]
# Install dev + test groups by default so `uv sync` / `uv run pytest` work out
# of the box. Production builds must pass `--no-default-groups` (see Dockerfile).
default-groups = ["dev", "test"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["venv", ".venv", "venv_test", "alembic/versions"]
# Disable type checking errors for third-party library decorators
disable_error_code = ["untyped-decorator"]
# Since mypy 2.0, --local-partial-types is enabled by default. It changes field type
# inference timing so that the pydantic.mypy plugin reads type_annotation=None when
# collecting BaseSettings fields and hits its assertion in pydantic/mypy.py
# ("All arguments must be fully typed"). Disable it to keep mypy 1.x inference
# semantics (upstream: python/mypy#18612, closed as not planned).
local_partial_types = false

# Third-party libraries - Use fine-grained rules instead of global ignore_errors
# Only ignore import errors for libraries lacking type support
[[tool.mypy.overrides]]
module = [
    "jieba.*",             # Missing type annotations
    "ddgs.*",              # Missing type annotations
    "yaml.*",              # Incomplete PyYAML type stubs
    "aiofiles.*",          # Incomplete aiofiles type stubs
    "dateutil.*",          # Incomplete dateutil type stubs
]
ignore_missing_imports = true

# LangChain ecosystem - Relax strict definitions without ignoring completely
[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langchain_community.*",
    "langgraph.*",
    "langgraph_checkpoint_postgres.*",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

# Other third-party libraries - Partial type support
[[tool.mypy.overrides]]
module = [
    "fastapi_pagination.*",
    "mem0.*",
    "slowapi.*",
    "structlog.*",
    "webdav4.*",
]
disallow_untyped_defs = false
warn_return_any = false

# Relax requirements for test suite
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Relax requirements for evaluation suite
[[tool.mypy.overrides]]
module = ["evals.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Relax requirements for Alembic configuration
[[tool.mypy.overrides]]
module = ["alembic.env"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
pythonpath = "."
asyncio_mode = "auto"
# Session-scoped event loop: the Postgres test engine (session fixture) must be
# usable from every async test without cross-loop rebinding.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 119
target-version = "py313"
exclude = ["migrations", "*.ipynb", "venv", ".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "ERA", "D", "UP"]
ignore = [
    "E501",
    "F401",
    "D100",
    "D104",
    "D107",
    "D203",
    "D205",
    "D213",
    "D415",
    "D101",
    "D102",
    "D103",
    "D105",
    "D106",
    "B904",
    "B008",
    # StrEnum migration needs separate evaluation: str(member) behavior change
    # would affect DB serialization and API output
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/**/*.py" = ["D"]
"alembic/**/*.py" = ["D", "ERA001"]

[tool.bandit]
exclude_dirs = ["tests", "alembic", "venv", ".venv"]
skips = ["B101", "B311"]
