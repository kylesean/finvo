name: finvo
description: "Finvo, a AI assistant for the financial management"
version: 0.2.2-alpha


environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Slang i18n
  slang: ^4.18.0
  slang_flutter: ^4.18.0

  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  riverpod_annotation: ^4.0.3
  record: ^6.1.1
  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  uuid: ^4.5.1
  shimmer: ^3.0.0
  forui: ^0.24.1
  collection: ^1.19.1
  crypto: ^3.0.7
  characters: ^1.4.0
  logging: ^1.3.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  fl_chart: ^1.2.0
  animate_do: ^4.2.0
  flutter_svg: ^2.3.0
  decimal: ^3.2.4
  flutter_timezone: ^5.0.1
  share_plus: ^12.0.1
  package_info_plus: ^8.3.0
  image_picker: ^1.1.2
  file_picker: ^10.3.7
  photo_view: ^0.15.0
  url_launcher: ^6.3.2
  visibility_detector: ^0.4.0+2
  # GenUI dependencies for dynamic UI generation
  # Note: GenUI packages from pub.dev
  genui: ^0.10.0
  a2ui_core: ^0.1.0
  json_schema_builder: ^0.1.3
  rrule: ^0.2.17
  speech_to_text: ^7.4.0
  gpt_markdown: ^1.1.8
  lottie: ^3.3.2
  http_parser: ^4.1.0
  qr_flutter: ^4.1.0
  chinese_font_library: ^1.2.0
  mobile_scanner: ^7.4.0
  just_audio: ^0.10.5
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  slang_build_runner: ^4.18.0
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  freezed: ^3.0.6
  mockito: ^5.4.4
  # CLI-only tooling (icon generation) must not ship in release builds
  flutter_launcher_icons: ^0.14.4
  async: ^2.13.1
  stream_channel: ^2.1.4
  fake_async: ^1.3.3

dependency_overrides:
  # riverpod_annotation 4.0.3 (used by riverpod_generator 4.0.4) pins
  # riverpod to exactly 3.3.2, which had the "setState() called during build"
  # ProviderScope bug (rrousselGit/riverpod#4781). flutter_riverpod ^3.4.2
  # carries the upstream fix and 3.4.x is a drop-in with no public API break.
  # Upgrading the codegen chain (annotation 4.0.6 / generator 4.0.8) instead
  # requires analyzer ^13, which the stable freezed line does not support yet
  # (freezed 4.0.0-dev only). Hence the runtime-only override; remove it and
  # bump annotation+generator together once freezed 4.x is released.
  riverpod: 3.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/vectors/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  # Android adaptive icon settings
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_monochrome: "assets/images/logo.png"
  # Remove iOS alpha channel for App Store
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
